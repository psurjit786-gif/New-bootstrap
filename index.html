<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div class="cantainer bg-light">
        <div class="row">
            <div class="col-6">
                <p class="h3 text-center text-primary">Registration Form</p>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-6">
                <form action="">
                <div class="mb-4">
                    <label for="fname" class="form-label fw-bold">First name</label>
                    <input type="text"
                     name="fname" 
                     id="fname" 
                     class="form-control" 
                     placeholder="enter your first name"
                      required>
                </div>
                <div class="mb-4">
                    <label for="lname" class="form-label fw-bold">last name</label>
                    <input type="text"
                     name="lname"
                      id="lname" 
                      class="form-control" 
                      placeholder="enter your last name" 
                      required>
                </div>
                <div class="mb-4">
                    <label for="uname" class="form-label fw-bold">User name</label>
                    <input type="text"
                     name="uname" 
                     id="uname"
                      class="form-control"
                       placeholder="enter your user name" 
                       required>
                </div>
                <div class="mb-4">
                    <label for="pass" class="form-label fw-bold">Password</label>
                    <input type="text" 
                    name="pass" 
                    id="pass"
                     class="form-control" 
                     placeholder="enter your password"
                      required>
                </div>
                <span class="form-text">password must contain one specail char</span>
                <div class="mb-4">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" 
                    name="email"
                     id="email" 
                     class="form-control"
                      placeholder="enter your email"
                       required>
                </div>
                 <div class="mb-4">
                    <label for="pass" class="form-label fw-bold">Password</label>
                    <input type="text"
                     name="pass"
                      id="pass" 
                      class="form-control"
                       placeholder="enter your password" 
                       required>
                </div>
                <span class="form-text">password must contain one specail char</span>
                 <div class="mb-4">
                    <label for="resume" class="form-label fw-bold">Upload Resume</label>
                    <input type="file"
                     name="resumme" 
                     id="resume"
                      class="form-control" 
                      placeholder="upload your resume"
                       required>
            </div>
            <div class="mb-4">
                <label for="gender" class="form-label fw-bold">Gender</label>
                <br>
                <input type="radio" name="gen" id="gender" class="form-check-input">
                <label for="gender" class="form-check-label">Male</label>
                <br>
                <input type="radio" name="gen" id="gender" class="form-check-input">
                <label for="gender" class="form-check-label">FeMale</label>
            </div>

            <div class="mb-4">
                <label for="skill" class="form-label fw-bold">Skill</label>
                <input type="checkbox" name="skill" id="skill" class="form-check-input">Java
                 <input type="checkbox" name="skill" id="skill" class="form-check-input">Php
                  <input type="checkbox" name="skill" id="skill" class="form-check-input">js
                   <input type="checkbox" name="skill" id="skill" class="form-check-input">Vs
                    <input type="checkbox" name="skill" id="skill" class="form-check-input">python
            </div>
            <div class="mb-4">
                <label for="city" class="form-label fw-bold">City</label>
                <select name="city" id="city" class="form-select">
                <option value="pune">PUNE</option>
                <option value="mumbai">MUJMBAI</option>
                <option value="kerla">KERLA</option>
                <option value="punjab">PUNJAB</option>
                <option value="haryana">HARYANA</option>
                <option value="up">UP</option>
                </select>
            </div>
            <div class="d-grid">
            <button class="btn btn-primary" type="submit">Submit form</button>
            </div>
             <div class="d-grid">
            <button class="btn btn-danger" type="reset">Cancel form</button>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
